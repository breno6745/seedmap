<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space - Proxy Real</title>
    <style>
        body { margin: 0; padding: 0; background-color: #05020c; color: #ffffff; font-family: 'Segoe UI', Roboto, sans-serif; overflow: hidden; height: 100vh; display: flex; }
        .sidebar { width: 70px; background-color: #0c0717; height: 100vh; display: flex; flex-direction: column; align-items: center; padding-top: 25px; border-right: 1px solid #160f26; box-sizing: border-box; gap: 28px; z-index: 10; }
        .sidebar-icon { color: #8b80a5; cursor: pointer; transition: color 0.2s, transform 0.2s; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 12px; font-size: 22px; user-select: none; }
        .sidebar-icon:hover { color: #a855f7; background-color: rgba(168, 85, 247, 0.1); transform: scale(1.1); }
        .sidebar-logo { color: #a855f7; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; font-size: 26px; }
        .main-content { flex: 1; display: flex; flex-direction: column; background: #05020c; position: relative; }
        .search-bar-container { background-color: #0c0717; padding: 12px 20px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #160f26; }
        .search-input { flex: 1; background: #160f26; border: 1px solid #2d1f4e; padding: 10px 15px; border-radius: 8px; color: white; font-size: 14px; outline: none; }
        .search-input:focus { border-color: #a855f7; }
        .search-btn { background: linear-gradient(135deg, #7c3aed, #a855f7); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .proxy-frame { flex: 1; border: none; background: white; width: 100%; height: 100%; }
        .placeholder-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: #b3a7d3; }
        .placeholder-text h2 { font-size: 2rem; color: white; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-logo">🚀</div>
        <div class="sidebar-icon" onclick="goHome()">🏠</div>
    </div>

    <div class="main-content">
        <div class="search-bar-container">
            <input type="text" id="url-input" class="search-input" placeholder="Digite o site com .com (ex: youtube.com) ou pesquise no Google...">
            <button class="search-btn" onclick="processProxy()">Navegar via Proxy 🛡️</button>
        </div>

        <div id="placeholder" class="placeholder-text">
            <h2>Navegador Criptografado Space</h2>
            <p>Os links digitados aqui passam por um túnel camuflado para a escola não bloquear.</p>
        </div>

        <iframe id="browser-frame" class="proxy-frame" style="display: none;"></iframe>
    </div>

    <script>
        function processProxy() {
            let input = document.getElementById('url-input').value.trim();
            if (!input) return;

            let targetUrl = "";
            if (input.includes('.') && !input.includes(' ')) {
                targetUrl = input.startsWith('http') ? input : 'https://' + input;
            } else {
                targetUrl = 'https://google.com' + encodeURIComponent(input);
            }

            // Aqui está o segredo: usamos o gateway livre do CroxyProxy/Codetabs que descriptografa os cabeçalhos das páginas em tempo real
            // Isso impede que o firewall intercepte a URL original
            let proxyGateway = "https://codetabs.com" + encodeURIComponent(targetUrl);
            
            document.getElementById('placeholder').style.display = 'none';
            let frame = document.getElementById('browser-frame');
            frame.style.display = 'block';
            frame.src = proxyGateway;
        }

        function goHome() {
            document.getElementById('browser-frame').style.display = 'none';
            document.getElementById('placeholder').style.display = 'block';
            document.getElementById('url-input').value = '';
        }
    </script>
</body>
</html>

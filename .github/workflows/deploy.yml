name: Build e publicar Seed Map

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar Emscripten
        run: |
          git clone --depth 1 --branch 3.1.64 https://github.com/emscripten-core/emsdk.git
          ./emsdk/emsdk install 3.1.64
          ./emsdk/emsdk activate 3.1.64

      - name: Baixar Cubiomes
        run: |
          git clone --depth 1 https://github.com/Cubitect/cubiomes.git

      - name: Compilar Cubiomes para WebAssembly
        shell: bash
        run: |
          source ./emsdk/emsdk_env.sh
          mkdir -p dist
          cp -R public/. dist/

          emcc             src/cubiomes_wrapper.c             cubiomes/generator.c             cubiomes/layers.c             cubiomes/biomes.c             cubiomes/biomenoise.c             cubiomes/noise.c             cubiomes/finders.c             cubiomes/util.c             -I cubiomes             -O3             -fwrapv             -s WASM=1             -s MODULARIZE=1             -s EXPORT_NAME=createCubiomesModule             -s ENVIRONMENT=web             -s ALLOW_MEMORY_GROWTH=1             -s FILESYSTEM=0             -s EXPORTED_FUNCTIONS='["_malloc","_free","_set_seed","_fill_biomes","_biome_at","_get_structure_region_size","_get_structure","_fill_strongholds","_get_world_spawn","_fill_mineshafts"]'             -s EXPORTED_RUNTIME_METHODS='["HEAP32"]'             -o dist/cubiomes.js


      - name: Baixar ícones abertos do Tabler Icons
        shell: bash
        run: |
          mkdir -p dist/icons

          download_icon() {
            local source_name="$1"
            local target_name="$2"
            local url="https://cdn.jsdelivr.net/npm/@tabler/icons@1.118.0/icons-png/${source_name}.png"

            echo "Baixando ${url}"
            curl --fail --location --retry 3 "$url" \
              --output "dist/icons/${target_name}"
          }

          download_icon "building-community" "village.png"
          download_icon "pyramid" "desert-temple.png"
          download_icon "trees" "jungle-temple.png"
          download_icon "home-search" "witch-hut.png"
          download_icon "building-castle" "monument.png"
          download_icon "eye" "stronghold.png"
          download_icon "pick" "mineshaft.png"
          download_icon "star" "spawn.png"

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar site compilado
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Principal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #0f0f1a);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 { margin-bottom: 30px; font-size: 2.5rem; text-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5); }
        .container { display: flex; gap: 40px; background: rgba(255, 255, 255, 0.05); padding: 40px; border-radius: 15px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); backdrop-filter: blur(4px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .btn-box { display: flex; flex-direction: column; align-items: center; text-align: center; }
        .btn { width: 100px; height: 100px; border-radius: 20px; border: none; cursor: pointer; font-size: 2rem; transition: transform 0.2s, box-shadow 0.2s; display: flex; align-items: center; justify-content: center; text-decoration: none; }
        .btn-space { background: linear-gradient(135deg, #4facfe, #00f2fe); box-shadow: 0px 5px 15px rgba(0, 242, 254, 0.4); }
        .btn-slope { background: linear-gradient(135deg, #ff0844, #ffb199); box-shadow: 0px 5px 15px rgba(255, 8, 68, 0.4); }
        .btn:hover { transform: scale(1.1); }
        .label { margin-top: 12px; font-size: 1.1rem; font-weight: 600; letter-spacing: 0.5px; }
    </style>
</head>
<body>
    <h1>Menu Principal</h1>
    <div class="container">
        <!-- Botão 1: Abre o site do proxy modificado -->
        <div class="btn-box">
            <a href="space.html" class="btn btn-space">🚀</a>
            <div class="label">Sites Desbloqueados</div>
        </div>
        <!-- Botão 2: Abre o jogo Slope oficial (Link alternativo não bloqueado) -->
        <div class="btn-box">
            <a href="https://slopegame.io" class="btn btn-slope" target="_blank">🟢</a>
            <div class="label">Slope</div>
        </div>
    </div>
</body>
</html>

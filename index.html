<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Seed Map estático inspirado no gerador GenLayer do Minecraft Java 1.8">
  <title>Seed Map Java 1.8 — GenLayer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">
    <strong>Seed Map Java 1.8</strong>
    <small>Versão intermediária GenLayer</small>
  </div>
  <div class="seedbar">
    <label for="seedInput">Seed</label>
    <input id="seedInput" type="text" spellcheck="false">
    <button id="applySeed">Aplicar</button>
  </div>
</header>

<main>
  <section id="mapArea">
    <canvas id="mapCanvas"></canvas>

    <div class="zoom">
      <button id="zoomIn">+</button>
      <button id="zoomOut">−</button>
      <button id="home">⌂</button>
    </div>

    <div id="status">Centro X 0, Z 0</div>
    <div id="loading">Preparando mapa…</div>
  </section>

  <aside>
    <h2>Camadas</h2>
    <label><input id="showGrid" type="checkbox" checked> Grade de chunks</label>
    <label><input id="showStructures" type="checkbox" checked> Estruturas</label>

    <h2>Estruturas</h2>
    <label><input class="structure" data-type="village" type="checkbox" checked> 🏘 Vilas</label>
    <label><input class="structure" data-type="temple" type="checkbox" checked> 🛕 Templos</label>
    <label><input class="structure" data-type="witch" type="checkbox" checked> 🧪 Cabanas de bruxa</label>
    <label><input class="structure" data-type="monument" type="checkbox" checked> 🔱 Monumentos</label>
    <label><input class="structure" data-type="stronghold" type="checkbox" checked> 👁 Strongholds</label>

    <h2>Cursor</h2>
    <div id="cursor">X 0, Z 0</div>
    <div id="biome">Bioma: —</div>

    <h2>Legenda</h2>
    <div id="legend"></div>

    <p class="warning">
      Esta versão é bem mais próxima do gerador antigo porque usa camadas discretas
      de ilha, clima, zoom, praias, colinas e rios. Ainda não é idêntica ao Chunk Base.
    </p>
  </aside>
</main>

<script src="script.js"></script>
</body>
</html>
